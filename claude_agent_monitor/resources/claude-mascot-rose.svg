<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 110 580 420">
  <!-- Claude mascot — rose variant (tonal match to terracotta) -->

  <!-- Body (pixel-art silhouette) -->
  <g fill="#D95777">
    <!-- Head block -->
    <rect x="120" y="120" width="400" height="160"/>
    <!-- Arms row (wider section with side protrusions) -->
    <rect x="40" y="280" width="560" height="80"/>
    <!-- Lower body -->
    <rect x="120" y="360" width="400" height="80"/>
    <!-- Legs -->
    <rect x="160" y="440" width="40" height="80"/>
    <rect x="240" y="440" width="40" height="80"/>
    <rect x="360" y="440" width="40" height="80"/>
    <rect x="440" y="440" width="40" height="80"/>
  </g>

  <!-- Eyes (white) — shortened and vertically centered inside the lens -->
  <rect x="200" y="220" width="40" height="40" fill="#FFFFFF"/>
  <rect x="400" y="220" width="40" height="40" fill="#FFFFFF"/>

  <!-- Glasses: black rim, transparent lens -->
  <g fill="none" stroke="#000000" stroke-width="10" stroke-linejoin="miter" stroke-linecap="square">
    <!-- Left lens -->
    <rect x="180" y="190" width="80" height="100"/>
    <!-- Right lens -->
    <rect x="380" y="190" width="80" height="100"/>
    <!-- Bridge -->
    <line x1="260" y1="240" x2="380" y2="240"/>
    <!-- Temples (glasses arms) -->
    <line x1="180" y1="240" x2="120" y2="240"/>
    <line x1="460" y1="240" x2="520" y2="240"/>
  </g>
</svg>
